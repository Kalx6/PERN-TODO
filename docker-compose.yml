version: "3.8"

services:
  # 1. PostgreSQL Database Service
  database:
    image: postgres:15
    container_name: todo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: tododb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # 2. Express Backend API Service
  backend:
    build: ./server
    container_name: todo_backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - database
    networks:
      - app-network

  # 3. React Frontend (Nginx) Service
  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: https://todo-backend-d0ax.onrender.com
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
